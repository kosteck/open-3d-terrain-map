<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Open 3D Terrain Map</title>
    <!-- Library versions: see "Dependencies" in CLAUDE.md before changing. maplibre-gl 6.x ships only as an ES module,
         imported at the top of the app script below; maplibre-contour is still a UMD global (mlcontour). -->
    <link href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
    <!-- Icon subset: icon_names must stay alphabetically sorted or Google Fonts rejects the request. -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add_road,anchor,block,close,contrast,directions_bike,domain,downhill_skiing,hiking,info,label,landscape,line_curve,map,satellite_alt,search,signpost,terrain,train,translate&display=block" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #map {
            position: absolute;
            inset: 0;
            /* "Space" around the globe: the canvas is transparent outside the planet. */
            background: #0b1020;
        }

        #side-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            width: 264px;
            max-width: calc(100vw - 70px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .panel-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 6px;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
        }

        /* --- Search --- */

        #search-form {
            display: flex;
            align-items: center;
            padding: 4px;
            gap: 4px;
        }

        /* Own clear button instead of the native one: Android draws it tiny, iOS Safari not at all. */
        #search-input::-webkit-search-cancel-button {
            -webkit-appearance: none;
            display: none;
        }

        #search-clear-button[hidden] {
            display: none;
        }

        #search-input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: none;
            font: inherit;
            padding: 6px 8px;
            background: transparent;
        }

        #search-results {
            list-style: none;
            margin: 0;
            padding: 4px 0;
            max-height: 40vh;
            overflow-y: auto;
        }

        #search-results:empty {
            display: none;
        }

        #search-results li button {
            display: block;
            color: inherit; /* iOS Safari otherwise renders button text in its blue tint */
            width: 100%;
            text-align: left;
            border: 0;
            background: transparent;
            font: inherit;
            padding: 6px 10px;
            cursor: pointer;
        }

        #search-results li button:hover,
        #search-results li button[aria-current="true"] {
            background: #e8f0fe;
        }

        #search-results .result-type {
            display: block;
            font-size: 11px;
            color: #666;
        }

        #search-results .search-message {
            padding: 6px 10px;
            color: #666;
        }

        /* --- Layer panel --- */

        #layer-panel summary {
            cursor: pointer;
            padding: 8px 12px;
            font-weight: 600;
            user-select: none;
        }

        /* Collapsed search (narrow screens): search card hidden, its button floats in the "Layers" row. */
        #search-open-button {
            display: none;
            float: right;
            width: 30px;
            height: 30px;
            margin: -5px -6px 0 8px;
        }

        #side-panel.search-collapsed #search-card {
            display: none;
        }

        #side-panel.search-collapsed #search-open-button {
            display: inline-flex;
        }

        /* Its tooltip would run off the right edge of a narrow screen. */
        #search-open-button::after {
            left: auto !important;
            right: 0;
        }

        #layer-panel .panel-body {
            padding: 0 12px 10px;
        }

        #layer-panel fieldset {
            border: 0;
            margin: 0 0 10px;
            padding: 0;
            min-width: 0;
        }

        #layer-panel legend {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #555;
            padding: 0;
            margin-bottom: 6px;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .icon-button {
            position: relative;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid #c9ccd1;
            border-radius: 6px;
            background: #fff;
            color: #333;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }

        .icon-button:hover {
            border-color: #1a73e8;
        }

        .icon-button[aria-pressed="true"] {
            background: #1a73e8;
            border-color: #1a73e8;
            color: #fff;
        }

        .icon-button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .icon-button .material-symbols-outlined {
            font-size: 22px;
        }

        /* Badge: small filled glyph in a circle at the bottom-right that tells similar icons apart
           (e.g. bike + signpost = signposted routes, bike + road = cycle paths, bike + mountains = MTB). */
        .icon-button.has-badge .material-symbols-outlined.icon-main {
            font-size: 20px;
            transform: translate(-2px, -2px);
        }

        .icon-button .material-symbols-outlined.icon-badge {
            position: absolute;
            right: -4px;
            bottom: -4px;
            padding: 1px;
            font-size: 15px;
            line-height: 1;
            font-variation-settings: 'FILL' 1;
            background: #fff;
            color: #1a73e8;
            border: 1px solid #c9ccd1;
            border-radius: 50%;
        }

        .icon-button[aria-pressed="true"] .icon-badge {
            border-color: #1a73e8;
        }

        #search-form .icon-button {
            border-color: transparent;
        }

        /* Tooltip from aria-label, so the visible hint and the accessible name never drift apart. */
        .icon-button[aria-label]:hover::after,
        .icon-button[aria-label]:focus-visible::after,
        .icon-button.tap-tooltip[aria-label]::after {
            content: attr(aria-label);
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 10;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(32, 33, 36, 0.92);
            color: #fff;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.3;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Touch screens have no hover: a tooltip stuck after a tap would only cover the map,
           so there the tooltip shows briefly after a tap instead (.tap-tooltip, set from JS). */
        @media (hover: none) {
            .icon-button[aria-label]:hover::after {
                content: none;
            }

            .icon-button.tap-tooltip[aria-label]::after {
                content: attr(aria-label);
            }
        }

        #rail-style {
            margin-top: 6px;
            width: 100%;
            font: inherit;
            font-size: 13px;
            padding: 4px;
        }

        #rail-style[hidden] {
            display: none;
        }

        #layer-panel input[type="range"] {
            width: 100%;
            margin: 2px 0 0;
        }

        #layer-panel .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
        }

        #layer-panel fieldset:disabled {
            opacity: 0.45;
        }

        #layer-panel .hint {
            font-size: 12px;
            color: #666;
            margin: 6px 0 0;
        }

        .panel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        #language-toggle {
            width: auto;
            padding: 0 8px;
            gap: 4px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
        }

        .footer-buttons {
            display: flex;
            gap: 4px;
            flex: none;
        }

        /* Footer buttons sit at the panel's right edge: anchor their tooltips to the right. */
        .footer-buttons .icon-button::after {
            left: auto !important;
            right: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="side-panel">
        <div class="panel-card" id="search-card">
            <form id="search-form" role="search">
                <input id="search-input" type="search" autocomplete="off" spellcheck="false">
                <button type="button" class="icon-button" id="search-clear-button" hidden>
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
                <button type="submit" class="icon-button" id="search-button">
                    <span class="material-symbols-outlined" aria-hidden="true">search</span>
                </button>
            </form>
            <ul id="search-results" aria-live="polite"></ul>
        </div>

        <details id="layer-panel" class="panel-card" open>
            <summary>
                <span data-i18n="panelTitle"></span>
                <!-- Narrow screens only: the search card collapses into this button (see setSearchCollapsed). -->
                <button type="button" class="icon-button" id="search-open-button">
                    <span class="material-symbols-outlined" aria-hidden="true">search</span>
                </button>
            </summary>
            <div class="panel-body">
                <fieldset>
                    <legend data-i18n="sectionBase"></legend>
                    <div class="button-row" id="base-buttons"></div>
                </fieldset>
                <fieldset>
                    <legend data-i18n="sectionOverlays"></legend>
                    <div class="button-row" id="overlay-buttons"></div>
                    <select id="rail-style" hidden></select>
                </fieldset>
                <fieldset>
                    <legend data-i18n="sectionTerrain"></legend>
                    <div class="button-row" id="terrain-buttons"></div>
                </fieldset>
                <fieldset id="contour-density-fieldset">
                    <legend data-i18n="densityLabel"></legend>
                    <input type="range" id="contour-density" min="1" max="5" step="1" value="3"
                        aria-describedby="contour-interval-info">
                    <div class="range-labels"><span data-i18n="sparser"></span><span data-i18n="denser"></span></div>
                    <div id="contour-interval-info" class="hint"></div>
                </fieldset>
                <div class="panel-footer">
                    <p class="hint" data-i18n="navigationHint"></p>
                    <div class="footer-buttons">
                        <a class="icon-button" id="about-link" target="_blank" rel="noopener">
                            <span class="material-symbols-outlined" aria-hidden="true">info</span>
                        </a>
                        <button type="button" class="icon-button" id="language-toggle">
                            <span class="material-symbols-outlined" aria-hidden="true">translate</span>
                            <span id="language-toggle-label"></span>
                        </button>
                    </div>
                </div>
            </div>
        </details>
    </div>

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.mjs';

        // --- Translations (EN default; PL when the browser's preferred language is Polish) ---

        const TRANSLATIONS = {
            en: {
                panelTitle: 'Layers',
                sectionBase: 'Base map',
                sectionOverlays: 'Overlays',
                sectionTerrain: 'Terrain & 3D',
                'base.osm': 'OpenStreetMap',
                'base.aerial': 'Aerial imagery (Esri)',
                'base.opentopomap': 'OpenTopoMap (topographic)',
                'base.none': 'No base map',
                'overlay.roads': 'Roads (Esri)',
                'overlay.rail': 'Railways (OpenRailwayMap)',
                'overlay.hiking': 'Hiking trails',
                'overlay.cycling': 'Signposted cycling routes (Waymarked Trails)',
                'overlay.cyclosm': 'Cycle lanes and paths (CyclOSM)',
                'overlay.mtb': 'Mountain bike trails',
                'overlay.ski': 'Ski pistes (OpenSnowMap)',
                'overlay.seamarks': 'Sea marks (OpenSeaMap)',
                'overlay.labels': 'Place names and borders (Esri)',
                railStyleLabel: 'Railway map style',
                'railStyle.standard': 'Railways: infrastructure',
                'railStyle.maxspeed': 'Railways: max speed',
                'railStyle.signals': 'Railways: signalling',
                'railStyle.electrification': 'Railways: electrification',
                'terrain.terrain3d': '3D terrain',
                'terrain.hillshade': 'Hillshade',
                'terrain.contours': 'Contour lines',
                'terrain.buildings': '3D buildings (OpenFreeMap, from zoom 14)',
                densityLabel: 'Contour density',
                sparser: 'sparser',
                denser: 'denser',
                contourInterval: (minor, major) => `At view centre: every ${minor} m, bold every ${major} m`,
                contourBelowMinZoom: 'Contour lines appear from zoom 10',
                navigationHint: 'Rotate / tilt: right mouse button or Ctrl + drag.',
                searchPlaceholder: 'Search place, region, country…',
                searchButton: 'Search (OpenStreetMap Nominatim) – shortcut: /',
                searchOpen: 'Search places',
                searchClear: 'Clear search',
                searchNoResults: 'Nothing found',
                searchFailed: 'Search failed, please try again',
                searchCoordinates: 'Coordinates',
                languageToggleLabel: 'PL',
                languageToggleTooltip: 'Przełącz na polski',
                aboutTooltip: 'About, licences and terms of use',
                attributionTermsLink: 'Licences & terms'
            },
            pl: {
                panelTitle: 'Warstwy',
                sectionBase: 'Mapa bazowa',
                sectionOverlays: 'Nakładki',
                sectionTerrain: 'Teren i 3D',
                'base.osm': 'OpenStreetMap',
                'base.aerial': 'Zdjęcia lotnicze (Esri)',
                'base.opentopomap': 'OpenTopoMap (topograficzna)',
                'base.none': 'Bez mapy bazowej',
                'overlay.roads': 'Drogi (Esri)',
                'overlay.rail': 'Koleje (OpenRailwayMap)',
                'overlay.hiking': 'Szlaki piesze',
                'overlay.cycling': 'Oznakowane szlaki rowerowe (Waymarked Trails)',
                'overlay.cyclosm': 'Drogi i ścieżki rowerowe (CyclOSM)',
                'overlay.mtb': 'Szlaki MTB',
                'overlay.ski': 'Trasy narciarskie (OpenSnowMap)',
                'overlay.seamarks': 'Znaki nawigacyjne (OpenSeaMap)',
                'overlay.labels': 'Nazwy miejscowości i granice (Esri)',
                railStyleLabel: 'Styl mapy kolejowej',
                'railStyle.standard': 'Koleje: infrastruktura',
                'railStyle.maxspeed': 'Koleje: prędkości maksymalne',
                'railStyle.signals': 'Koleje: sygnalizacja',
                'railStyle.electrification': 'Koleje: elektryfikacja',
                'terrain.terrain3d': 'Teren 3D',
                'terrain.hillshade': 'Cieniowanie',
                'terrain.contours': 'Poziomice',
                'terrain.buildings': 'Budynki 3D (OpenFreeMap, od zoomu 14)',
                densityLabel: 'Gęstość poziomic',
                sparser: 'rzadziej',
                denser: 'gęściej',
                contourInterval: (minor, major) => `W środku widoku: co ${minor} m, pogrubione co ${major} m`,
                contourBelowMinZoom: 'Poziomice widoczne od zoomu 10',
                navigationHint: 'Obrót / pochylenie: prawy przycisk myszy lub Ctrl + przeciąganie.',
                searchPlaceholder: 'Szukaj miejscowości, regionu, kraju…',
                searchButton: 'Szukaj (OpenStreetMap Nominatim) – skrót: /',
                searchOpen: 'Szukaj miejsc',
                searchClear: 'Wyczyść wyszukiwanie',
                searchNoResults: 'Nic nie znaleziono',
                searchFailed: 'Wyszukiwanie nie powiodło się, spróbuj ponownie',
                searchCoordinates: 'Współrzędne',
                languageToggleLabel: 'EN',
                languageToggleTooltip: 'Switch to English',
                aboutTooltip: 'O mapie, licencje i warunki użycia',
                attributionTermsLink: 'Licencje i warunki'
            }
        };

        // MapLibre's own control tooltips; keys missing here fall back to MapLibre's English defaults.
        const MAPLIBRE_LOCALE_PL = {
            'AttributionControl.ToggleAttribution': 'Pokaż/ukryj atrybucje',
            'FullscreenControl.Enter': 'Pełny ekran',
            'FullscreenControl.Exit': 'Zamknij pełny ekran',
            'GeolocateControl.FindMyLocation': 'Pokaż moją lokalizację',
            'GeolocateControl.LocationNotAvailable': 'Lokalizacja niedostępna',
            'NavigationControl.ResetBearing': 'Ustaw północ u góry',
            'NavigationControl.ZoomIn': 'Przybliż',
            'NavigationControl.ZoomOut': 'Oddal',
            'Popup.Close': 'Zamknij'
        };

        const LANGUAGES = ['en', 'pl'];

        function detectBrowserLanguage() {
            const preferred = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
            return preferred.toLowerCase().startsWith('pl') ? 'pl' : 'en';
        }

        // --- Layer catalogue ---

        const OSM_ATTRIBUTION = '<a href="https://www.openstreetmap.org/copyright">&copy; OpenStreetMap Contributors</a>';
        const OSM_CONTRIBUTORS = '&copy; OpenStreetMap contributors';

        function rasterSource(tiles, maxzoom, attribution) {
            return { type: 'raster', tiles, tileSize: 256, maxzoom, attribution };
        }

        function subdomainTiles(template) {
            return ['a', 'b', 'c'].map((subdomain) => template.replace('{s}', subdomain));
        }

        // Exactly one base map is visible; 'none' leaves only the background colour.
        const BASE_MAPS = [
            {
                id: 'osm',
                icon: 'map',
                source: rasterSource(['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], 19, OSM_ATTRIBUTION)
            },
            {
                id: 'aerial',
                icon: 'satellite_alt',
                source: rasterSource(
                    ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                    19,
                    'Source: Esri, Vantor, Earthstar Geographics, and the GIS User Community'
                )
            },
            {
                id: 'opentopomap',
                icon: 'terrain',
                source: rasterSource(
                    subdomainTiles('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'),
                    17,
                    OSM_ATTRIBUTION + ', SRTM | Style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
                )
            },
            { id: 'none', icon: 'block', source: null }
        ];
        const BASE_MAP_IDS = BASE_MAPS.map((baseMap) => baseMap.id);

        const RAIL_STYLES = ['standard', 'maxspeed', 'signals', 'electrification'];

        function railTiles(railStyle) {
            return subdomainTiles(`https://{s}.tiles.openrailwaymap.org/${railStyle}/{z}/{x}/{y}.png`);
        }

        // Transparent raster overlays, any number at once. Array order = drawing order;
        // aboveContours puts text overlays over the contour lines so names stay readable.
        const WAYMARKED_ATTRIBUTION = '<a href="https://waymarkedtrails.org">&copy; Waymarked Trails</a>, ' + OSM_ATTRIBUTION;
        const OVERLAYS = [
            {
                id: 'roads',
                icon: 'add_road',
                source: rasterSource(
                    ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'],
                    19,
                    'Esri, HERE, Garmin, ' + OSM_CONTRIBUTORS
                )
            },
            {
                // cyclosm-lite = CyclOSM's transparent overlay (cycle lanes, tracks, paths) without the base map.
                id: 'cyclosm',
                icon: 'directions_bike',
                badge: 'add_road',
                source: rasterSource(
                    subdomainTiles('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm-lite/{z}/{x}/{y}.png'),
                    19,
                    '<a href="https://www.cyclosm.org">CyclOSM</a> (CC-BY-SA 2.0), ' + OSM_ATTRIBUTION
                )
            },
            {
                id: 'rail',
                icon: 'train',
                source: rasterSource(
                    railTiles('standard'),
                    19,
                    'Data ' + OSM_ATTRIBUTION + ', Style: CC-BY-SA 2.0 <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>'
                )
            },
            {
                id: 'hiking',
                icon: 'hiking',
                source: rasterSource(['https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png'], 18, WAYMARKED_ATTRIBUTION)
            },
            {
                id: 'cycling',
                icon: 'directions_bike',
                badge: 'signpost',
                source: rasterSource(['https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png'], 18, WAYMARKED_ATTRIBUTION)
            },
            {
                id: 'mtb',
                icon: 'directions_bike',
                badge: 'landscape',
                source: rasterSource(['https://tile.waymarkedtrails.org/mtb/{z}/{x}/{y}.png'], 18, WAYMARKED_ATTRIBUTION)
            },
            {
                id: 'ski',
                icon: 'downhill_skiing',
                source: rasterSource(
                    ['https://tiles.opensnowmap.org/pistes/{z}/{x}/{y}.png'],
                    18,
                    '<a href="https://www.opensnowmap.org">&copy; OpenSnowMap</a>, ' + OSM_ATTRIBUTION
                )
            },
            {
                id: 'seamarks',
                icon: 'anchor',
                source: rasterSource(
                    ['https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png'],
                    18,
                    '<a href="https://www.openseamap.org">&copy; OpenSeaMap contributors</a> (CC-BY-SA 2.0)'
                )
            },
            {
                id: 'labels',
                icon: 'label',
                aboveContours: true,
                source: rasterSource(
                    ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
                    19,
                    'Esri, HERE, Garmin, ' + OSM_CONTRIBUTORS + ', and the GIS user community'
                )
            }
        ];
        const OVERLAY_IDS = OVERLAYS.map((overlay) => overlay.id);

        // mapLayerIds: style layers each toggle shows/hides.
        // terrain3d has no style layers: it switches map.setTerrain() on/off.
        const TERRAIN_LAYERS = [
            { id: 'terrain3d', icon: 'landscape', mapLayerIds: [] },
            { id: 'hillshade', icon: 'contrast', mapLayerIds: ['hillshade'] },
            { id: 'contours', icon: 'line_curve', mapLayerIds: ['contour-lines', 'contour-labels'] },
            { id: 'buildings', icon: 'domain', mapLayerIds: ['buildings-3d'] }
        ];
        const TERRAIN_LAYER_IDS = TERRAIN_LAYERS.map((terrainLayer) => terrainLayer.id);
        const DEFAULT_TERRAIN_LAYER_IDS = ['terrain3d', 'hillshade'];
        const TERRAIN_3D_SPECIFICATION = { source: 'terrainSource', exaggeration: 1 };

        // OpenFreeMap: free OpenMapTiles-schema vector tiles (no key); its 'building' layer carries extrusion heights.
        const BUILDINGS_MINZOOM = 14;

        // --- Contour density ---
        // Intervals follow a 1-2-5 ladder; a contour step's major (labelled) line is two rungs up (1->5, 20->100).
        const CONTOUR_INTERVAL_LADDER_M = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000];
        // Ladder index of the minor interval per zoom at default density (3): z13 = 20 m, z16 = 5 m.
        const CONTOUR_DEFAULT_LADDER_INDEX_BY_ZOOM = { 10: 7, 11: 6, 12: 5, 13: 4, 14: 4, 15: 3, 16: 2 };
        const CONTOUR_DENSITY_MIN = 1;
        const CONTOUR_DENSITY_MAX = 5; // at z16+ this reaches the 1 m rung
        const CONTOUR_DENSITY_DEFAULT = 3;

        function contourIntervalsForZoom(zoomKey, density) {
            const index = Math.min(
                Math.max(CONTOUR_DEFAULT_LADDER_INDEX_BY_ZOOM[zoomKey] + CONTOUR_DENSITY_DEFAULT - density, 0),
                CONTOUR_INTERVAL_LADDER_M.length - 3
            );
            return [CONTOUR_INTERVAL_LADDER_M[index], CONTOUR_INTERVAL_LADDER_M[index + 2]];
        }

        function contourThresholdsForDensity(density) {
            const thresholds = {};
            for (const zoomKey of Object.keys(CONTOUR_DEFAULT_LADDER_INDEX_BY_ZOOM)) {
                thresholds[zoomKey] = contourIntervalsForZoom(zoomKey, density);
            }
            return thresholds;
        }

        // maplibre-contour applies the threshold with the largest zoom key <= current zoom.
        function contourIntervalsAtMapZoom(zoom, density) {
            const zoomKeys = Object.keys(CONTOUR_DEFAULT_LADDER_INDEX_BY_ZOOM).map(Number);
            const zoomKey = zoomKeys.filter((key) => key <= Math.floor(zoom)).pop();
            return zoomKey === undefined ? null : contourIntervalsForZoom(zoomKey, density);
        }

        // --- App state <-> URL hash (alongside MapLibre's own "map=" parameter) ---
        // base=osm & overlays=rail,hiking & terrain=hillshade,contours & density=3 & rail=standard & lang=pl
        // A missing list parameter means "default"; a present-but-empty one means "nothing selected".

        function parseListParam(params, name, allowedIds, defaultIds) {
            if (!params.has(name)) {
                return new Set(defaultIds);
            }
            return new Set(params.get(name).split(',').filter((id) => allowedIds.includes(id)));
        }

        function readAppStateFromHash() {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const base = params.get('base');
            const density = Number(params.get('density'));
            const railStyle = params.get('rail');
            const lang = params.get('lang');
            return {
                base: BASE_MAP_IDS.includes(base) ? base : 'osm',
                overlays: parseListParam(params, 'overlays', OVERLAY_IDS, []),
                terrain: parseListParam(params, 'terrain', TERRAIN_LAYER_IDS, DEFAULT_TERRAIN_LAYER_IDS),
                density: Number.isInteger(density) && density >= CONTOUR_DENSITY_MIN && density <= CONTOUR_DENSITY_MAX
                    ? density
                    : CONTOUR_DENSITY_DEFAULT,
                railStyle: RAIL_STYLES.includes(railStyle) ? railStyle : 'standard',
                // lang is written to the URL only after an explicit switch, so shared links follow the viewer's browser.
                lang: LANGUAGES.includes(lang) ? lang : detectBrowserLanguage(),
                langFromUrl: LANGUAGES.includes(lang)
            };
        }

        function writeAppStateToHash() {
            const params = new URLSearchParams(window.location.hash.slice(1));
            params.set('base', appState.base);
            params.set('overlays', [...appState.overlays].join(','));
            params.set('terrain', [...appState.terrain].join(','));
            params.set('density', appState.density);
            if (appState.overlays.has('rail')) {
                params.set('rail', appState.railStyle);
            } else {
                params.delete('rail');
            }
            if (appState.langFromUrl) {
                params.set('lang', appState.lang);
            }
            // URLSearchParams encodes "/" (MapLibre's map= value) and ","; keep both readable.
            const hash = '#' + params.toString().replace(/%2F/g, '/').replace(/%2C/g, ',');
            window.history.replaceState(window.history.state, '', hash);
        }

        const appState = readAppStateFromHash();

        function aboutPageUrl() {
            return `about.html#lang=${appState.lang}`;
        }
        const t = TRANSLATIONS[appState.lang];

        // --- DEM sources: terrain and hillshade read Mapterhorn TileJSON; contours use maplibre-contour's DemSource ---

        // Mapterhorn serves z16 (~1 m/px) where high-res data exists (e.g. Poland, Alps) and only up to z12 elsewhere;
        // there, contour tiles above z12 404 and stay empty. z16 is needed for meaningful 1 m contours.
        const CONTOUR_DEM_MAXZOOM = 16;

        const demSource = new mlcontour.DemSource({
            url: 'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp',
            encoding: 'terrarium',
            maxzoom: CONTOUR_DEM_MAXZOOM,
            worker: true
        });
        demSource.setupMaplibre(maplibregl);

        function contourTileUrlForDensity(density) {
            return demSource.contourProtocolUrl({
                thresholds: contourThresholdsForDensity(density),
                elevationKey: 'ele',
                levelKey: 'level',
                contourLayer: 'contours',
                buffer: 1,
                overzoom: 2
            });
        }

        // --- Style ---

        const baseMapLayerId = (id) => `base-${id}`;
        const overlayLayerId = (id) => `overlay-${id}`;

        function visibility(isVisible) {
            return { visibility: isVisible ? 'visible' : 'none' };
        }

        function buildStyle() {
            const sources = {
                terrainSource: {
                    type: 'raster-dem',
                    url: 'https://tiles.mapterhorn.com/tilejson.json'
                },
                // Separate from terrainSource on purpose: MapLibre recommends not sharing one raster-dem source
                // between terrain and hillshade.
                hillshadeSource: {
                    type: 'raster-dem',
                    url: 'https://tiles.mapterhorn.com/tilejson.json'
                },
                openFreeMapSource: {
                    type: 'vector',
                    url: 'https://tiles.openfreemap.org/planet'
                },
                contourSource: {
                    type: 'vector',
                    tiles: [contourTileUrlForDensity(appState.density)],
                    minzoom: 10,
                    maxzoom: CONTOUR_DEM_MAXZOOM + 2 // overzoom: 2
                }
            };

            const baseMapLayers = [];
            for (const baseMap of BASE_MAPS.filter((candidate) => candidate.source)) {
                sources[baseMapLayerId(baseMap.id)] = baseMap.source;
                baseMapLayers.push({
                    id: baseMapLayerId(baseMap.id),
                    type: 'raster',
                    source: baseMapLayerId(baseMap.id),
                    layout: visibility(baseMap.id === appState.base)
                });
            }

            const overlayLayers = (aboveContours) => OVERLAYS
                .filter((overlay) => Boolean(overlay.aboveContours) === aboveContours)
                .map((overlay) => ({
                    id: overlayLayerId(overlay.id),
                    type: 'raster',
                    source: overlayLayerId(overlay.id),
                    layout: visibility(appState.overlays.has(overlay.id))
                }));
            for (const overlay of OVERLAYS) {
                sources[overlayLayerId(overlay.id)] = overlay.id === 'rail'
                    ? { ...overlay.source, tiles: railTiles(appState.railStyle) }
                    : overlay.source;
            }

            const showHillshade = appState.terrain.has('hillshade');
            const showContours = appState.terrain.has('contours');
            const showBuildings = appState.terrain.has('buildings');

            return {
                version: 8,
                glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
                sources,
                layers: [
                    {
                        id: 'background',
                        type: 'background',
                        paint: { 'background-color': '#f2efe9' }
                    },
                    ...baseMapLayers,
                    {
                        id: 'hillshade',
                        type: 'hillshade',
                        source: 'hillshadeSource',
                        layout: visibility(showHillshade),
                        paint: { 'hillshade-shadow-color': '#473B24' }
                    },
                    ...overlayLayers(false),
                    {
                        id: 'contour-lines',
                        type: 'line',
                        source: 'contourSource',
                        'source-layer': 'contours',
                        layout: visibility(showContours),
                        paint: {
                            'line-color': 'rgb(215, 151, 60)',
                            'line-width': ['match', ['get', 'level'], 1, 1.2, 0.6]
                        }
                    },
                    {
                        id: 'contour-labels',
                        type: 'symbol',
                        source: 'contourSource',
                        'source-layer': 'contours',
                        filter: ['>', ['get', 'level'], 0],
                        layout: {
                            ...visibility(showContours),
                            'symbol-placement': 'line',
                            'text-size': 13,
                            'text-field': ['concat', ['number-format', ['get', 'ele'], {}], ' m'],
                            'text-font': ['Noto Sans Regular']
                        },
                        paint: {
                            'text-color': 'rgb(150, 100, 35)',
                            'text-halo-color': 'white',
                            'text-halo-width': 1.5
                        }
                    },
                    {
                        id: 'buildings-3d',
                        type: 'fill-extrusion',
                        source: 'openFreeMapSource',
                        'source-layer': 'building',
                        minzoom: BUILDINGS_MINZOOM,
                        filter: ['!=', ['get', 'hide_3d'], true],
                        layout: visibility(showBuildings),
                        paint: {
                            // One neutral colour: OSM building:colour tags are sparse and often garish (pure red/black blocks).
                            'fill-extrusion-color': '#d8cfc4',
                            // Grow buildings out of the ground over one zoom level instead of popping in.
                            'fill-extrusion-height': [
                                'interpolate', ['linear'], ['zoom'],
                                BUILDINGS_MINZOOM, 0,
                                BUILDINGS_MINZOOM + 1, ['get', 'render_height']
                            ],
                            'fill-extrusion-base': [
                                'interpolate', ['linear'], ['zoom'],
                                BUILDINGS_MINZOOM, 0,
                                BUILDINGS_MINZOOM + 1, ['get', 'render_min_height']
                            ],
                            'fill-extrusion-opacity': 0.9
                        }
                    },
                    ...overlayLayers(true)
                ],
                ...(appState.terrain.has('terrain3d') ? { terrain: TERRAIN_3D_SPECIFICATION } : {}),
                // Globe when zoomed out; MapLibre switches to flat Mercator by itself when zooming in.
                projection: { type: 'globe' },
                sky: {
                    // Atmosphere glow around the globe when zoomed out, fading out as the map turns flat.
                    'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0]
                }
            };
        }

        const map = new maplibregl.Map({
            container: 'map',
            hash: 'map',
            // Default view: Innsbruck, as in the Mapterhorn examples.
            center: [11.392208, 47.276486],
            zoom: 13,
            pitch: 60,
            bearing: 7.8,
            maxPitch: 85,
            locale: appState.lang === 'pl' ? MAPLIBRE_LOCALE_PL : undefined,
            // Permanent link to licences and terms next to the providers' attributions.
            attributionControl: {
                customAttribution: `<a href="${aboutPageUrl()}" target="_blank" rel="noopener">${t.attributionTermsLink}</a>`
            },
            style: buildStyle()
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
        map.addControl(new maplibregl.FullscreenControl(), 'top-right');
        map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), 'top-right');
        map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

        // --- Panel ---

        // Layer buttons exist before the style finishes loading; clicks made that early are queued until it does.
        function whenStyleReady(callback) {
            if (map.isStyleLoaded()) {
                callback();
            } else {
                map.once('style.load', callback);
            }
        }

        function createIconButton(icon, label, onClick, badge) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = badge ? 'icon-button has-badge' : 'icon-button';
            button.setAttribute('aria-label', label);
            button.innerHTML = `<span class="material-symbols-outlined icon-main" aria-hidden="true">${icon}</span>`
                + (badge ? `<span class="material-symbols-outlined icon-badge" aria-hidden="true">${badge}</span>` : '');
            button.addEventListener('click', () => whenStyleReady(onClick));
            return button;
        }

        function setPressed(button, isPressed) {
            button.setAttribute('aria-pressed', String(isPressed));
        }

        const baseMapButtons = new Map();
        const overlayButtons = new Map();
        const terrainButtons = new Map();

        function renderPanel() {
            document.documentElement.lang = appState.lang;
            document.querySelectorAll('[data-i18n]').forEach((element) => {
                element.textContent = t[element.dataset.i18n];
            });

            for (const baseMap of BASE_MAPS) {
                const button = createIconButton(baseMap.icon, t[`base.${baseMap.id}`], () => selectBaseMap(baseMap.id));
                baseMapButtons.set(baseMap.id, button);
                document.getElementById('base-buttons').append(button);
            }
            for (const overlay of OVERLAYS) {
                const button = createIconButton(overlay.icon, t[`overlay.${overlay.id}`], () => toggleOverlay(overlay.id), overlay.badge);
                overlayButtons.set(overlay.id, button);
                document.getElementById('overlay-buttons').append(button);
            }
            for (const terrainLayer of TERRAIN_LAYERS) {
                const button = createIconButton(terrainLayer.icon, t[`terrain.${terrainLayer.id}`], () => toggleTerrainLayer(terrainLayer.id));
                terrainButtons.set(terrainLayer.id, button);
                document.getElementById('terrain-buttons').append(button);
            }

            const railStyleSelect = document.getElementById('rail-style');
            railStyleSelect.setAttribute('aria-label', t.railStyleLabel);
            for (const railStyle of RAIL_STYLES) {
                railStyleSelect.append(new Option(t[`railStyle.${railStyle}`], railStyle));
            }

            const searchInput = document.getElementById('search-input');
            searchInput.placeholder = t.searchPlaceholder;
            searchInput.setAttribute('aria-label', t.searchPlaceholder);
            document.getElementById('search-button').setAttribute('aria-label', t.searchButton);
            document.getElementById('search-open-button').setAttribute('aria-label', t.searchOpen);
            document.getElementById('search-clear-button').setAttribute('aria-label', t.searchClear);

            const languageToggle = document.getElementById('language-toggle');
            languageToggle.setAttribute('aria-label', t.languageToggleTooltip);

            const aboutLink = document.getElementById('about-link');
            aboutLink.href = aboutPageUrl();
            aboutLink.setAttribute('aria-label', t.aboutTooltip);
            document.getElementById('language-toggle-label').textContent = t.languageToggleLabel;

            // Collapse the layer panel by default on narrow screens so the map stays usable.
            if (window.matchMedia('(max-width: 600px)').matches) {
                document.getElementById('layer-panel').open = false;
            }
        }

        function syncPanelToState() {
            for (const [id, button] of baseMapButtons) setPressed(button, id === appState.base);
            for (const [id, button] of overlayButtons) setPressed(button, appState.overlays.has(id));
            for (const [id, button] of terrainButtons) setPressed(button, appState.terrain.has(id));

            const railStyleSelect = document.getElementById('rail-style');
            railStyleSelect.hidden = !appState.overlays.has('rail');
            railStyleSelect.value = appState.railStyle;

            document.getElementById('contour-density').value = appState.density;
            document.getElementById('contour-density-fieldset').disabled = !appState.terrain.has('contours');
            updateContourIntervalInfo();
        }

        function updateContourIntervalInfo() {
            const intervals = contourIntervalsAtMapZoom(map.getZoom(), appState.density);
            document.getElementById('contour-interval-info').textContent = intervals
                ? t.contourInterval(intervals[0], intervals[1])
                : t.contourBelowMinZoom;
        }

        // --- Layer switching ---

        function selectBaseMap(baseMapId) {
            appState.base = baseMapId;
            for (const baseMap of BASE_MAPS.filter((candidate) => candidate.source)) {
                map.setLayoutProperty(baseMapLayerId(baseMap.id), 'visibility', visibility(baseMap.id === baseMapId).visibility);
            }
            afterStateChange();
        }

        function toggleOverlay(overlayId) {
            if (appState.overlays.has(overlayId)) {
                appState.overlays.delete(overlayId);
            } else {
                appState.overlays.add(overlayId);
            }
            map.setLayoutProperty(overlayLayerId(overlayId), 'visibility', visibility(appState.overlays.has(overlayId)).visibility);
            afterStateChange();
        }

        function selectRailStyle(railStyle) {
            appState.railStyle = railStyle;
            map.getSource(overlayLayerId('rail')).setTiles(railTiles(railStyle));
            afterStateChange();
        }

        function toggleTerrainLayer(terrainLayerId) {
            if (appState.terrain.has(terrainLayerId)) {
                appState.terrain.delete(terrainLayerId);
            } else {
                appState.terrain.add(terrainLayerId);
            }
            const terrainLayer = TERRAIN_LAYERS.find((candidate) => candidate.id === terrainLayerId);
            for (const layerId of terrainLayer.mapLayerIds) {
                map.setLayoutProperty(layerId, 'visibility', visibility(appState.terrain.has(terrainLayerId)).visibility);
            }
            if (terrainLayerId === 'terrain3d') {
                map.setTerrain(appState.terrain.has('terrain3d') ? TERRAIN_3D_SPECIFICATION : null);
            }
            afterStateChange();
        }

        function selectContourDensity(density) {
            appState.density = density;
            map.getSource('contourSource').setTiles([contourTileUrlForDensity(density)]);
            afterStateChange();
        }

        function afterStateChange() {
            syncPanelToState();
            writeAppStateToHash();
        }

        function switchLanguage() {
            appState.lang = appState.lang === 'en' ? 'pl' : 'en';
            appState.langFromUrl = true;
            writeAppStateToHash();
            // MapLibre reads its locale only at construction; the hash keeps view and layers across the reload.
            window.location.reload();
        }

        // --- Search (OpenStreetMap Nominatim) ---
        // Nominatim usage policy: max 1 request/s and no search-as-you-type, so search runs on submit only.

        const NOMINATIM_SEARCH_URL = 'https://nominatim.openstreetmap.org/search';
        const NOMINATIM_MIN_REQUEST_INTERVAL_MS = 1000;
        const COORDINATES_PATTERN = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;

        let lastSearchRequestAt = 0;
        let searchResultMarker = null;

        function showSearchMarker(lngLat) {
            if (!searchResultMarker) {
                searchResultMarker = new maplibregl.Marker({ color: '#1a73e8' });
            }
            searchResultMarker.setLngLat(lngLat).addTo(map);
        }

        function clearSearch() {
            document.getElementById('search-results').replaceChildren();
            if (searchResultMarker) searchResultMarker.remove();
            updateSearchClearButton();
        }

        function updateSearchClearButton() {
            document.getElementById('search-clear-button').hidden = !isSearchInUse();
        }

        function showSearchMessage(message) {
            const item = document.createElement('li');
            item.className = 'search-message';
            item.textContent = message;
            document.getElementById('search-results').replaceChildren(item);
            updateSearchClearButton();
        }

        function goToSearchResult(result) {
            const [south, north, west, east] = result.boundingbox.map(Number);
            map.fitBounds([[west, south], [east, north]], { padding: 60, maxZoom: 15, duration: 2000 });
            showSearchMarker([Number(result.lon), Number(result.lat)]);
        }

        function renderSearchResults(results) {
            const items = results.map((result, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.setAttribute('aria-current', String(index === 0));
                button.textContent = result.display_name;
                const type = document.createElement('span');
                type.className = 'result-type';
                type.textContent = (result.addresstype || result.type || '').replace(/_/g, ' ');
                button.append(type);
                button.addEventListener('click', () => {
                    document.querySelectorAll('#search-results button').forEach((other) => other.setAttribute('aria-current', 'false'));
                    button.setAttribute('aria-current', 'true');
                    goToSearchResult(result);
                });
                const item = document.createElement('li');
                item.append(button);
                return item;
            });
            document.getElementById('search-results').replaceChildren(...items);
            updateSearchClearButton();
        }

        async function runSearch(query) {
            const coordinates = query.match(COORDINATES_PATTERN);
            if (coordinates) {
                const lngLat = [Number(coordinates[2]), Number(coordinates[1])];
                showSearchMessage(`${t.searchCoordinates}: ${coordinates[1]}, ${coordinates[2]}`);
                map.flyTo({ center: lngLat, zoom: Math.max(map.getZoom(), 14), duration: 2000 });
                showSearchMarker(lngLat);
                return;
            }

            const waitMs = lastSearchRequestAt + NOMINATIM_MIN_REQUEST_INTERVAL_MS - Date.now();
            if (waitMs > 0) {
                await new Promise((resolve) => setTimeout(resolve, waitMs));
            }
            lastSearchRequestAt = Date.now();

            const params = new URLSearchParams({
                q: query,
                format: 'jsonv2',
                limit: '5',
                'accept-language': appState.lang
            });
            const searchButton = document.getElementById('search-button');
            searchButton.disabled = true;
            try {
                const response = await fetch(`${NOMINATIM_SEARCH_URL}?${params}`);
                if (!response.ok) throw new Error(`Nominatim HTTP ${response.status}`);
                const results = await response.json();
                if (results.length === 0) {
                    showSearchMessage(t.searchNoResults);
                    return;
                }
                renderSearchResults(results);
                goToSearchResult(results[0]);
            } catch (error) {
                console.error(error);
                showSearchMessage(t.searchFailed);
            } finally {
                searchButton.disabled = false;
            }
        }

        // --- Wiring ---

        // On touch screens, briefly show what a tapped button does (there is no hover to reveal the tooltip).
        const TAP_TOOLTIP_DURATION_MS = 1500;
        const touchScreenQuery = window.matchMedia('(hover: none)');
        let tapTooltipTimer = null;
        document.getElementById('side-panel').addEventListener('click', (event) => {
            const button = event.target.closest('.icon-button');
            if (!button || !touchScreenQuery.matches) return;
            document.querySelectorAll('.icon-button.tap-tooltip').forEach((other) => other.classList.remove('tap-tooltip'));
            clearTimeout(tapTooltipTimer);
            button.classList.add('tap-tooltip');
            tapTooltipTimer = setTimeout(() => button.classList.remove('tap-tooltip'), TAP_TOOLTIP_DURATION_MS);
        });

        renderPanel();
        syncPanelToState();

        // 'style.load' fires once layers exist; 'load' would wait for the first full set of tiles.
        map.once('style.load', () => {
            syncPanelToState();
            writeAppStateToHash();

            map.on('zoomend', updateContourIntervalInfo);
            document.getElementById('contour-density').addEventListener('input', (event) => {
                selectContourDensity(Number(event.target.value));
            });
            document.getElementById('rail-style').addEventListener('change', (event) => {
                selectRailStyle(event.target.value);
            });
        });

        document.getElementById('language-toggle').addEventListener('click', switchLanguage);

        document.getElementById('search-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (query) runSearch(query);
        });
        document.getElementById('search-input').addEventListener('input', (event) => {
            if (event.target.value) {
                updateSearchClearButton();
            } else {
                clearSearch();
            }
        });
        document.getElementById('search-clear-button').addEventListener('click', () => {
            const searchInput = document.getElementById('search-input');
            searchInput.value = '';
            clearSearch();
            if (narrowScreenQuery.matches) {
                // Phones: done searching – drop the keyboard and fold the search away.
                searchInput.blur();
                collapseSearchIfIdle();
            } else {
                searchInput.focus();
            }
        });
        document.getElementById('search-input').addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                event.target.value = '';
                clearSearch();
                event.target.blur();
                collapseSearchIfIdle();
            }
        });

        // --- Collapsible search on narrow screens ---
        // Phones collapse the idle search card into a button in the "Layers" row; it stays open while it holds
        // text or results. Wide screens always show it (discoverability beats ~45 px of space there).

        const narrowScreenQuery = window.matchMedia('(max-width: 600px)');

        function setSearchCollapsed(collapsed) {
            document.getElementById('side-panel').classList.toggle('search-collapsed', collapsed && narrowScreenQuery.matches);
        }

        function isSearchInUse() {
            return document.getElementById('search-input').value.trim() !== ''
                || document.getElementById('search-results').children.length > 0;
        }

        function collapseSearchIfIdle() {
            if (narrowScreenQuery.matches && !isSearchInUse()) setSearchCollapsed(true);
        }

        function openSearch() {
            setSearchCollapsed(false);
            document.getElementById('search-input').focus();
        }

        document.getElementById('search-open-button').addEventListener('click', (event) => {
            event.preventDefault(); // the button sits inside <summary>; don't toggle the layer panel
            openSearch();
        });
        document.getElementById('search-input').addEventListener('blur', collapseSearchIfIdle);
        map.on('click', collapseSearchIfIdle);
        narrowScreenQuery.addEventListener('change', () => {
            if (narrowScreenQuery.matches) {
                collapseSearchIfIdle();
            } else {
                setSearchCollapsed(false);
            }
        });
        collapseSearchIfIdle();

        // "/" jumps to the search box (as on GitHub or YouTube), unless the user is already typing somewhere.
        document.addEventListener('keydown', (event) => {
            if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('input, textarea, select, [contenteditable]')) return;
            event.preventDefault();
            openSearch();
        });
    </script>
</body>

</html>
